name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install & Build Web
        working-directory: frontend
        run: |
          npm ci
          npx vite build --base=./
        env:
          VITE_SUPABASE_URL: https://rgtvzpwbwikjbamyoahs.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_UqNqBlNxh93qtM4-U5Imag_LOuURVIZ
          VITE_API_BASE: https://campus-fix-production.up.railway.app

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-fix-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
