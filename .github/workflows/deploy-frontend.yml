name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: https://rgtvzpwbwikjbamyoahs.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_UqNqBlNxh93qtM4-U5Imag_LOuURVIZ
          VITE_API_BASE: https://campus-fix-production.up.railway.app

      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4
