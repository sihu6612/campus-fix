name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: https://rgtvzpwbwikjbamyoahs.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJndHZ6cHdia3dpamtiYW15b2FocyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzQ4MTczNjM5LCJleHAiOjIwNjM3NDk2Mzl9.ZXMGxcNFbBi4Yl_c9AYgHmZ3mVXKZAO3Sp8veZlFPos
          VITE_API_BASE: https://campusfix-api.up.railway.app

      - uses: actions/configure-pages@v4
        with:
            enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4
